version: 2
updates:
  # ルート (開発用の Biome) とテンプレートの依存パッケージ
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/template"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/template"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
