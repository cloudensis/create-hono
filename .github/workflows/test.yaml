name: Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm test
      - run: node index.js "$RUNNER_TEMP/app"
      - run: npm install --no-audit --no-fund
        working-directory: ${{ runner.temp }}/app
      - run: npm run lint
        working-directory: ${{ runner.temp }}/app
      - run: npm run typecheck
        working-directory: ${{ runner.temp }}/app
      - run: npm test
        working-directory: ${{ runner.temp }}/app
      - run: npm run build
        working-directory: ${{ runner.temp }}/app
      - run: node scripts/smoke-template.mjs "$RUNNER_TEMP/app"
