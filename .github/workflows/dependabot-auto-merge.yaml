name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # 自動マージするのは次のものだけ（それ以外は手動でレビューする）
      # - patch 更新（プレリリースを除く）
      # - minor 更新（0.x とプレリリースを除く。0.x の minor は破壊的変更になりうる）
      # `--auto` はブランチ保護の必須チェックが通るまで待つ。必須チェックが
      # 未設定だと即座にマージされるため、README の前提を満たしておくこと
      - if: >-
          !contains(steps.metadata.outputs.new-version, '-') && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' || (
              steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
              !startsWith(steps.metadata.outputs.new-version, '0.')
            )
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
